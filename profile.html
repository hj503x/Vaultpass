<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultPass — Profile</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .profile-page {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .profile-hero {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-bottom: 40px;
    }

    .profile-info { flex: 1; }
    .profile-name-lg { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 4px; }
    .profile-username-lg { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; color: var(--text-dim); margin-bottom: 16px; }
    .profile-bio-lg { color: var(--text-dim); font-size: 0.95rem; line-height: 1.7; max-width: 500px; }

    .profile-price-card {
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-align: center;
      min-width: 200px;
      flex-shrink: 0;
    }

    .profile-price-card-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .profile-price-card-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 8px;
    }

    .profile-price-card-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* ===== MESSAGE FORM ===== */
    .message-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .message-section-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(201,168,76,0.06), transparent);
    }

    .message-section-header h2 { font-size: 1.5rem; margin-bottom: 4px; }
    .message-section-header p { color: var(--text-dim); font-size: 0.875rem; }

    .message-form { padding: 28px; display: flex; flex-direction: column; gap: 20px; }

    /* Payment simulation */
    .payment-box {
      background: var(--surface-2);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .payment-box-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .payment-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .payment-total-label { font-size: 0.9rem; color: var(--text-dim); }
    .payment-total-amount {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
    }

    .card-input-row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; }

    .card-preview {
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-preview-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .card-preview-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
    }

    /* Already messaged state */
    .already-messaged {
      background: var(--gold-glow);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
    }

    .not-logged-in {
      text-align: center;
      padding: 28px;
    }

    @media (max-width: 640px) {
      .profile-hero { flex-direction: column; }
      .profile-price-card { width: 100%; }
      .card-input-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="nav"></nav>

  <div class="page" style="padding-top:64px;">
    <div class="profile-page" id="profile-page">
      <div style="text-align:center;padding:80px 0;color:var(--text-muted);">Loading...</div>
    </div>
  </div>

  <!-- Payment Processing Modal -->
  <div id="toast-container"></div>
  <script src="js/vault.js"></script>
  <script>
    renderNav();

    const currentUser = VAULT.getCurrentUser();
    const params = new URLSearchParams(window.location.search);
    const username = params.get('u');

    function init() {
      if (!username) { window.location.href = 'discover.html'; return; }
      const profile = VAULT.getUserByUsername(username);
      if (!profile) { renderNotFound(); return; }
      document.title = `VaultPass — ${profile.name}`;
      renderProfile(profile);
    }

    function renderNotFound() {
      document.getElementById('profile-page').innerHTML = `
        <div style="text-align:center;padding:80px 0;">
          <div style="font-size:3rem;color:var(--text-muted);margin-bottom:16px;">◈</div>
          <h2 style="margin-bottom:12px;">Profile not found</h2>
          <a href="discover.html" class="btn btn-outline">Browse Profiles</a>
        </div>
      `;
    }

    function renderProfile(profile) {
      const isOwn = currentUser && currentUser.id === profile.id;
      const alreadyMessaged = currentUser && VAULT.hasConversationWith(currentUser.id, profile.id);

      document.getElementById('profile-page').innerHTML = `
        <!-- Profile Header -->
        <div class="profile-hero">
          <div class="avatar avatar-xl">${profile.avatar}</div>
          <div class="profile-info">
            <h1 class="profile-name-lg">${profile.name}</h1>
            <div class="profile-username-lg">@${profile.username}</div>
            <p class="profile-bio-lg">${profile.bio || 'No bio provided.'}</p>
            <div style="margin-top:16px;">
              <span class="badge badge-gold">◆ VaultPass Member</span>
            </div>
          </div>
          <div class="profile-price-card">
            <div class="profile-price-card-label">Message Price</div>
            <div class="profile-price-card-num">${VAULT.formatPrice(profile.price)}</div>
            <div class="profile-price-card-sub">One-time fee for delivery.<br>Replies are always free.</div>
            ${!isOwn && !alreadyMessaged && currentUser ? `
              <button class="btn btn-gold btn-full" onclick="scrollToForm()">Send Message</button>
            ` : ''}
          </div>
        </div>

        <div class="divider"></div>

        <!-- Message Form / Status -->
        <div class="message-section">
          ${renderMessageSection(profile, isOwn, alreadyMessaged)}
        </div>
      `;
    }

    function scrollToForm() {
      document.querySelector('.message-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderMessageSection(profile, isOwn, alreadyMessaged) {
      if (isOwn) {
        return `
          <div class="message-section-header">
            <h2>This is your profile</h2>
            <p>Share this link so others can reach you.</p>
          </div>
          <div class="message-form">
            <div class="inbox-link" style="max-width:100%;background:var(--surface-2);border:1px solid var(--border-bright);border-radius:var(--radius-lg);padding:16px 20px;display:flex;align-items:center;gap:12px;">
              <div style="font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--gold);flex:1;word-break:break-all;">${window.location.href}</div>
              <button class="copy-btn" onclick="navigator.clipboard.writeText('${window.location.href}').then(()=>toast('Link copied!','success'))">Copy</button>
            </div>
            <a href="dashboard.html" class="btn btn-outline btn-full">Go to Inbox</a>
          </div>
        `;
      }

      if (alreadyMessaged) {
        return `
          <div class="message-section-header">
            <h2>You're already connected</h2>
            <p>You've already sent a message to ${profile.name}. The conversation is open — replies are free.</p>
          </div>
          <div class="message-form">
            <div class="already-messaged">
              <div style="font-size:2rem;margin-bottom:12px;">✦</div>
              <p style="color:var(--text-dim);margin-bottom:16px;">Head to your inbox to continue the conversation.</p>
              <a href="dashboard.html" class="btn btn-gold">Open Inbox</a>
            </div>
          </div>
        `;
      }

      if (!currentUser) {
        return `
          <div class="message-section-header">
            <h2>Send a message to ${profile.name}</h2>
            <p>Pay ${VAULT.formatPrice(profile.price)} to get your message delivered. Replies are always free.</p>
          </div>
          <div class="message-form">
            <div class="not-logged-in">
              <div style="font-size:2rem;margin-bottom:12px;color:var(--gold);">◈</div>
              <p style="color:var(--text-dim);margin-bottom:20px;">Create a free account to send paid messages.</p>
              <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <a href="signup.html" class="btn btn-gold">Create Account</a>
                <a href="login.html" class="btn btn-outline">Sign In</a>
              </div>
            </div>
          </div>
        `;
      }

      // Full message + payment form
      return `
        <div class="message-section-header">
          <h2>Message ${profile.name}</h2>
          <p>Your message will be delivered directly to their VaultPass inbox. Payment confirms your intent.</p>
        </div>
        <div class="message-form" id="send-form">
          <div class="form-group">
            <label class="form-label">Subject</label>
            <input type="text" class="form-input" id="msg-subject" placeholder="Partnership opportunity, quick intro, etc." />
          </div>
          <div class="form-group">
            <label class="form-label">Your Message</label>
            <textarea class="form-textarea" id="msg-body" placeholder="Be clear and direct. This is your one shot to make an impression — make it count." style="min-height:160px;"></textarea>
          </div>

          <!-- Payment -->
          <div class="payment-box">
            <div class="payment-box-label">◆ Payment Details</div>
            <div class="payment-total">
              <span class="payment-total-label">Delivery fee to VaultPass</span>
              <span class="payment-total-amount">${VAULT.formatPrice(profile.price)}</span>
            </div>

            <div class="card-preview">
              <span class="card-preview-text" id="card-display">•••• •••• •••• ••••</span>
              <span class="card-preview-logo">VP</span>
            </div>

            <div style="display:grid;gap:12px;">
              <div class="form-group">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-input mono" id="card-number" placeholder="1234 5678 9012 3456" maxlength="19"
                  oninput="formatCard(this)" />
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div class="form-group">
                  <label class="form-label">Expiry</label>
                  <input type="text" class="form-input mono" id="card-expiry" placeholder="MM/YY" maxlength="5"
                    oninput="formatExpiry(this)" />
                </div>
                <div class="form-group">
                  <label class="form-label">CVV</label>
                  <input type="text" class="form-input mono" id="card-cvv" placeholder="•••" maxlength="3" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Cardholder Name</label>
                <input type="text" class="form-input" id="card-name" placeholder="Name on card" />
              </div>
            </div>

            <div style="margin-top:16px;padding:12px;background:rgba(201,168,76,0.05);border:1px solid var(--border);border-radius:var(--radius);">
              <p style="font-size:0.75rem;color:var(--text-muted);line-height:1.6;">
                ◆ <strong style="color:var(--text-dim);">Demo mode:</strong> No real payment is processed. Enter any card details to simulate. ${profile.name} receives the message immediately.
              </p>
            </div>
          </div>

          <div id="send-error" class="form-error hidden"></div>

          <button class="btn btn-gold btn-full btn-lg" id="send-btn" onclick="submitMessage('${profile.id}', ${profile.price})">
            Pay ${VAULT.formatPrice(profile.price)} & Send Message
          </button>
        </div>
      `;
    }

    function formatCard(input) {
      let val = input.value.replace(/\D/g, '').slice(0, 16);
      val = val.replace(/(.{4})/g, '$1 ').trim();
      input.value = val;
      const last4 = val.replace(/\s/g, '').slice(-4);
      if (last4.length > 0) {
        document.getElementById('card-display').textContent = `•••• •••• •••• ${last4.padStart(4, '•')}`;
      } else {
        document.getElementById('card-display').textContent = '•••• •••• •••• ••••';
      }
    }

    function formatExpiry(input) {
      let val = input.value.replace(/\D/g, '').slice(0, 4);
      if (val.length >= 2) val = val.slice(0, 2) + '/' + val.slice(2);
      input.value = val;
    }

    function submitMessage(receiverId, price) {
      const subject = document.getElementById('msg-subject').value.trim();
      const body = document.getElementById('msg-body').value.trim();
      const cardNumber = document.getElementById('card-number').value.replace(/\s/g, '');
      const expiry = document.getElementById('card-expiry').value;
      const cvv = document.getElementById('card-cvv').value;
      const cardName = document.getElementById('card-name').value.trim();
      const errEl = document.getElementById('send-error');
      const btn = document.getElementById('send-btn');

      errEl.classList.add('hidden');

      if (!body) { showSendError('Please write your message.'); return; }
      if (body.length < 20) { showSendError('Your message is too short. Make it worth reading.'); return; }
      if (!cardNumber || cardNumber.length < 14) { showSendError('Please enter a valid card number.'); return; }
      if (!expiry || expiry.length < 5) { showSendError('Please enter a valid expiry date.'); return; }
      if (!cvv || cvv.length < 3) { showSendError('Please enter your CVV.'); return; }
      if (!cardName) { showSendError('Please enter the cardholder name.'); return; }

      btn.disabled = true;
      btn.textContent = 'Processing payment...';

      // Simulate payment processing
      setTimeout(() => {
        btn.textContent = 'Delivering message...';

        setTimeout(() => {
          VAULT.sendMessage({
            senderId: currentUser.id,
            receiverId,
            subject,
            body,
            amountPaid: price,
          });

          toast(`Message delivered! ${VAULT.formatPrice(price)} charged.`, 'success');

          // Show success state
          document.getElementById('send-form').innerHTML = `
            <div style="text-align:center;padding:40px 20px;">
              <div style="font-size:3rem;margin-bottom:16px;color:var(--gold);">✦</div>
              <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.8rem;margin-bottom:12px;">Message delivered.</h3>
              <p style="color:var(--text-dim);margin-bottom:24px;line-height:1.7;">
                Your message has been delivered to ${VAULT.getUserById(receiverId)?.name}'s inbox.<br>
                If they reply, you'll see it in your own inbox.
              </p>
              <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <a href="dashboard.html" class="btn btn-gold">Go to My Inbox</a>
                <a href="discover.html" class="btn btn-outline">Browse More</a>
              </div>
            </div>
          `;
        }, 800);
      }, 1200);
    }

    function showSendError(msg) {
      const el = document.getElementById('send-error');
      if (el) { el.textContent = msg; el.classList.remove('hidden'); }
    }

    init();
  </script>
</body>
</html>
